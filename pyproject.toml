[project]
name = "nonebot-plugin-quote-card"
version = "0.1.0"
description = "引用消息生成「名人名言」风格卡片（NoneBot2 x OneBot v11）"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.10"
dependencies = [
    "nonebot2>=2.5,<3",
    "nonebot-adapter-onebot>=2.4",
    "httpx>=0.27",
    "pillow>=10.0",
]

[project.optional-dependencies]
dev = ["pytest>=8", "pytest-asyncio>=0.23", "ruff>=0.6"]

[project.urls]
Homepage = "https://github.com/MortisBot/nonebot-plugin-quote-card"
Issues = "https://github.com/MortisBot/nonebot-plugin-quote-card/issues"
Repository = "https://github.com/MortisBot/nonebot-plugin-quote-card"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["nonebot_plugin_quote_card"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"

[tool.ruff]
line-length = 120
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B"]
ignore = ["E501"]
